<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Embed Relay</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="player"></div>

  <script>
    const url = new URL(location.href);
    const videoId = url.searchParams.get("v");

    if (!videoId) {
      document.body.textContent = "Missing ?v=VIDEO_ID";
    }

    let ytPlayer;

    const playerConfig = {
      videoId,
      playerVars: {
        enablejsapi: 1,
        playsinline: 1,
        modestbranding: 1,
        origin: location.origin
      },
      events: {
        onReady: () => {
          // Notify Ionic
          window.parent.dispatchEvent(new CustomEvent(videoId, {
            detail: {
              ready: true,
            }
          }));
        },
        onStateChange: (event) => {
          // Notify Ionic of state change
          window.parent.dispatchEvent(new CustomEvent(videoId, {
            detail: {
              state: event.data,
            }
          }));
        }
      }
    };

    // Load YouTube API
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("player", playerConfig);
    }

    // Receive commands from Ionic
    window.addEventListener("message", (event) => {
      const action = event.data;

      switch (action) {
        case "play": ytPlayer.playVideo(); break;
        case "pause": ytPlayer.pauseVideo(); break;
        case "stop": ytPlayer.stopVideo(); break;
        case "mute": ytPlayer.mute(); break;
        case "unmute": ytPlayer.unMute(); break;

        case "get-time":
          window.parent.dispatchEvent(new CustomEvent(videoId, {
            detail: { time: ytPlayer.getCurrentTime() }
          }));
          break;

        case "get-state":
          window.parent.dispatchEvent(new CustomEvent(videoId, {
            detail: { state: ytPlayer.getPlayerState() }
          }));
          break;
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Relay</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="player"></div>
  
  <script>
    const url = new URL(location.href);
    const videoId = url.searchParams.get("v");
  
    if (!videoId) {
      document.body.textContent = "Missing ?v=VIDEO_ID";
    }
  
    let ytPlayer;
  
    const config = {
      videoId,
      playerVars: {
        enablejsapi: 1,
        playsinline: 1,
        modestbranding: 1,
      },
      events: {
        onReady: () => {
          window.parent.postMessage(
            { videoId, type: "ready" },
            "*"
          );
        },
        onStateChange: (event) => {
          window.parent.postMessage(
            { videoId, type: "state", state: event.data },
            "*"
          );
        }
      }
    };
  
    // Load YouTube API
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
  
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("player", config);
    }
  
    // Listen for commands
    window.addEventListener("message", (event) => {
      const action = event.data;
  
      switch (action) {
        case "play": ytPlayer.playVideo(); break;
        case "pause": ytPlayer.pauseVideo(); break;
        case "stop": ytPlayer.stopVideo(); break;
        case "mute": ytPlayer.mute(); break;
        case "unmute": ytPlayer.unMute(); break;
        case "get-time":
          window.parent.postMessage(
            { videoId, type: "time", time: ytPlayer.getCurrentTime() },
            "*"
          );
          break;
        case "get-state":
          window.parent.postMessage(
            { videoId, type: "state", state: ytPlayer.getPlayerState() },
            "*"
          );
          break;
      }
    });
  </script>
  
  </body>
</html>

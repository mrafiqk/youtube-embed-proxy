<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube Embed Relay</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- IMPORTANT: YouTube API will create the iframe automatically -->
  <div id="player"></div>

  <script>
    const u = new URL(location.href);
    const v = u.searchParams.get('v');

    if (!v) {
      document.body.textContent = 'Missing ?v=VIDEO_ID';
    }

    // Player configuration
    let ytPlayer;
    const playerConfig = {
      videoId: v,
      playerVars: {
        enablejsapi: 1,
        rel: 0,
        modestbranding: 1,
        playsinline: u.searchParams.get('playsinline') || '1',
        autoplay: u.searchParams.get('autoplay') || '0',
        origin: location.origin
      },
      events: {
        onReady: () => {
          // Listen for commands from Ionic app
          window.addEventListener(v, (event) => {
            const action = event.data;

            switch (action) {
              case "play":
                ytPlayer.playVideo();
                break;
              case "pause":
                ytPlayer.pauseVideo();
                break;
              case "stop":
                ytPlayer.stopVideo();
                break;
              case "mute":
                ytPlayer.mute();
                break;
              case "unmute":
                ytPlayer.unMute();
                break;
              case "get-time":
                event.source.postMessage(
                  { currentTime: ytPlayer.getCurrentTime() },
                  "*"
                );
                break;
              case "get-state":
                event.source.postMessage(
                  { state: ytPlayer.getPlayerState() },
                  "*"
                );
                break;
            }
          });
        }
      }
    };

    // Load YouTube iframe API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    // YouTube API callback
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', playerConfig);
    }
  </script>

</body>
</html>
